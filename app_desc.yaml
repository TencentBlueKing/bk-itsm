specVersion: 3
appVersion: 2.8.1
app:
  region: default
  bkAppCode: bk_itsm
  bkAppName: 流程服务
  bkAppNameEn: ITSM
  market:
    category: 运维工具
    introduction: 流程服务是蓝鲸推出的轻量级ITSM，通过可自定义设计的流程模块，覆盖IT服务中的不同管理活动或应用场景。帮助企业用户规范内部管理流程，提升沟通及管理效率。
    displayOptions:
      width: 1280
      height: 720
      openMode: new_tab
      isWinMaximize: true
modules:
  - name: default
    isDefault: true
    sourceDir: ./src
    language: Python
    spec:
      addons:
        - name: mysql
        - name: rabbitmq
        - name: redis
        - name: bkrepo
        - name: otel
      configuration:
        env:
          - name: PIP_VERSION
            value: '24.0'
            description: PIP版本
          - name: RUN_VER
            value: open
            description: 运行环境
          - name: GUNICORN_THREAD_NUM
            value: '10'
            description: GunicornThread数量
      processes:
        - name: web
          procCommand: bash ./bin/start_web.sh
          resQuotaPlan: 2C4G
          replicas: 1
          services:
            - name: web
              protocol: TCP
              exposedType:
                name: bk/http
              targetPort: 5000
              port: 80
            - name: metrics
              protocol: TCP
              port: 5001
              targetPort: 5001
        - name: beat
          procCommand: python manage.py celery beat -l info
          resQuotaPlan: 2C4G
          replicas: 1
        - name: pworker
          procCommand: python manage.py celery worker -n prefork@%h -P threads -c 10 -l info --max-tasks-per-child=100
          resQuotaPlan: 2C4G
          replicas: 1
        - name: gworker
          procCommand: python manage.py celery worker -P gevent -n gevent@%h -c 4 -l info --max-tasks-per-child=100
          resQuotaPlan: 2C4G
          replicas: 1
      hooks:
        preRelease:
          procCommand: bash ./bin/pre-release
      svcDiscovery:
        bkSaaS:
          - bkAppCode: bk_itsm
      observability:
        monitoring:
          metrics:
            - process: web
              serviceName: metrics
              path: /metrics
